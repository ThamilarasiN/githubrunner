name: "github test run for echo"
on: workflow_dispatch
jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: hello step
        run: echo "hello"
      - name: run multiple commandds
        run: |
          echo "line1"
          echo "line2"
  build:
    runs-on: ubuntu-latest
    steps:
      - name: run build step
        run: echo "build step"

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: run test step
        run: echo "test step"
